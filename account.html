<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Account — Wsamiaw</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="site.css"/>
  <script src="i18n.js" defer></script>
</head>
<body data-page-title-key="page_title_account">
  <div class="wrap">
    <nav class="nav">
      <div class="nav-left">
        <select id="lang-select" class="lang-select" aria-label="Language">
          <option value="en">English</option>
          <option value="tr">Türkçe</option>
          <option value="es">Español</option>
          <option value="zh">中文</option>
        </select>
        <a class="nav-brand" href="index.html">Wsamiaw</a>
      </div>
      <div class="nav-links">
        <a href="index.html" data-i18n="nav_home">Home</a>
        <a href="account.html" data-i18n="nav_account">Account</a>
        <a href="https://discord.gg/nMTEzHcwSW" rel="noopener">Discord</a>
      </div>
    </nav>

    <div id="verify-banner" class="msg" hidden style="margin-bottom:1rem"></div>

    <div id="guest" class="account-box">
      <section class="panel">
        <h2 data-i18n="account_heading">Account</h2>
        <p style="margin-bottom:1rem" data-i18n="account_intro"></p>
        <div class="tabs">
          <button type="button" class="tab active" data-tab="login" data-i18n="tab_login">Sign in</button>
          <button type="button" class="tab" data-tab="register" data-i18n="tab_register">Register</button>
        </div>
        <form id="form-login" class="form active">
          <label><span data-i18n="label_email">Email</span>
            <input type="email" name="email" required autocomplete="email"/>
          </label>
          <label><span data-i18n="label_password">Password</span>
            <input type="password" name="password" required autocomplete="current-password"/>
          </label>
          <button type="submit" class="btn btn-primary" style="width:100%" data-i18n="btn_login">Sign in</button>
        </form>
        <form id="form-2fa" class="form" hidden>
          <p data-i18n="twofa_prompt"></p>
          <label><span data-i18n="label_code">Code</span>
            <input type="text" name="code" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="one-time-code"/>
          </label>
          <button type="submit" class="btn btn-primary" style="width:100%" data-i18n="btn_verify">Verify</button>
        </form>
        <form id="form-register" class="form">
          <label><span data-i18n="label_email">Email</span>
            <input type="email" name="email" required autocomplete="email"/>
          </label>
          <label><span data-i18n="label_password_min">Password (min. 8 characters)</span>
            <input type="password" name="password" required minlength="8" autocomplete="new-password"/>
          </label>
          <button type="submit" class="btn btn-primary" style="width:100%" data-i18n="btn_register">Register</button>
        </form>
        <form id="form-resend" class="form" style="margin-top:0.75rem">
          <p class="note" data-i18n="resend_note"></p>
          <label><span data-i18n="label_email">Email</span>
            <input type="email" name="email" autocomplete="email"/>
          </label>
          <button type="submit" class="btn btn-ghost" style="width:100%" data-i18n="btn_resend">Resend verification email</button>
        </form>
        <div id="form-msg"></div>
      </section>
    </div>

    <div id="user" class="account-box" hidden>
      <section class="panel">
        <h2 data-i18n="welcome">Welcome</h2>
        <p id="user-email" style="margin-bottom:0.5rem"></p>
        <p id="user-verified" class="note" style="margin-bottom:1rem"></p>

        <div id="panel-2fa" style="margin-bottom:1.25rem;padding-top:0.5rem;border-top:1px solid var(--border, #333)">
          <h3 style="font-size:1rem;margin-bottom:0.5rem" data-i18n="twofa_heading"></h3>
          <p id="2fa-status" class="note"></p>
          <div id="2fa-setup" hidden>
            <p class="note" data-i18n="twofa_setup_note"></p>
            <p class="license-key" id="2fa-secret"></p>
            <p class="note"><a id="2fa-otpauth" href="#" target="_blank" rel="noopener" data-i18n="twofa_otpauth"></a></p>
            <form id="form-2fa-enable" style="margin-top:0.75rem;display:flex;flex-direction:column;gap:0.75rem">
              <label><span data-i18n="label_first_code">First code</span>
                <input type="text" name="code" inputmode="numeric" maxlength="8"/>
              </label>
              <button type="submit" class="btn btn-secondary" data-i18n="btn_enable_2fa">Enable 2FA</button>
            </form>
          </div>
          <form id="form-2fa-disable" hidden style="margin-top:0.75rem;display:flex;flex-direction:column;gap:0.75rem">
            <label><span data-i18n="label_disable_code">Code to disable</span>
              <input type="text" name="code" inputmode="numeric" maxlength="8"/>
            </label>
            <button type="submit" class="btn btn-ghost" data-i18n="btn_disable_2fa">Disable 2FA</button>
          </form>
          <button type="button" id="btn-2fa-start" class="btn btn-secondary" hidden data-i18n="btn_setup_2fa">Set up 2FA</button>
          <div id="2fa-msg"></div>
        </div>

        <p data-i18n="license_intro"></p>
        <p class="license-key" id="license-hint" data-i18n="license_hint"></p>
        <p class="note" style="margin-top:1rem" data-i18n="license_test_note"></p>
        <form id="form-verify" style="margin-top:0.75rem;display:flex;flex-direction:column;gap:0.75rem">
          <label><span data-i18n="label_license_key">License key</span>
            <input type="text" name="key" placeholder="WSAM-...." autocomplete="off"/>
          </label>
          <button type="submit" class="btn btn-secondary" data-i18n="btn_check_license">Verify</button>
        </form>
        <div id="verify-msg"></div>
        <button type="button" id="btn-logout" class="btn btn-ghost" style="margin-top:1.25rem;width:100%" data-i18n="btn_logout">Sign out</button>
      </section>
    </div>
  </div>
  <script src="api.js"></script>
  <script>
    const tabs = document.querySelectorAll(".tab");
    const formLogin = document.getElementById("form-login");
    const form2fa = document.getElementById("form-2fa");
    const formRegister = document.getElementById("form-register");
    const formResend = document.getElementById("form-resend");
    const formMsg = document.getElementById("form-msg");
    const guest = document.getElementById("guest");
    const userPanel = document.getElementById("user");
    const verifyBanner = document.getElementById("verify-banner");

    let pending2faToken = null;
    let pending2faEmail = null;

    function showMsg(el, text, ok) {
      el.className = "msg " + (ok ? "ok" : "err");
      el.textContent = text;
    }

    tabs.forEach((t) => {
      t.addEventListener("click", () => {
        tabs.forEach((x) => x.classList.remove("active"));
        t.classList.add("active");
        const name = t.dataset.tab;
        formLogin.classList.toggle("active", name === "login");
        formRegister.classList.toggle("active", name === "register");
        formLogin.hidden = false;
        form2fa.hidden = true;
        formMsg.textContent = "";
      });
    });

    async function refreshAccount(session) {
      const { ok, data } = await apiGet("/account", session.token);
      if (!ok) {
        clearSession();
        showGuest();
        return;
      }
      document.getElementById("user-verified").textContent = data.email_verified
        ? t("verified_ok")
        : t("verified_pending");

      const status = document.getElementById("2fa-status");
      const setup = document.getElementById("2fa-setup");
      const disableForm = document.getElementById("form-2fa-disable");
      const startBtn = document.getElementById("btn-2fa-start");

      if (data.totp_enabled) {
        status.textContent = t("twofa_on");
        setup.hidden = true;
        disableForm.hidden = false;
        startBtn.hidden = true;
      } else {
        status.textContent = t("twofa_off");
        disableForm.hidden = true;
        startBtn.hidden = false;
        setup.hidden = true;
      }
    }

    function showUser(session) {
      guest.hidden = true;
      userPanel.hidden = false;
      document.getElementById("user-email").textContent = session.email;
      refreshAccount(session);
    }

    function showGuest() {
      guest.hidden = false;
      userPanel.hidden = true;
      pending2faToken = null;
      pending2faEmail = null;
    }

    async function tryVerifyEmailFromUrl() {
      const params = new URLSearchParams(location.search);
      const token = params.get("verify");
      if (!token) return;
      const { ok, data } = await apiPost("/verify-email", { token });
      verifyBanner.hidden = false;
      if (ok) {
        showMsg(verifyBanner, t("verify_email_ok"), true);
      } else {
        const err = data.error === "token_expired" ? t("verify_email_expired") : t("verify_email_fail");
        showMsg(verifyBanner, err, false);
      }
      history.replaceState({}, "", "account.html");
    }

    document.addEventListener("DOMContentLoaded", () => {
      tryVerifyEmailFromUrl();
      const existing = getSession();
      if (existing) showUser(existing);
    });

    formLogin.addEventListener("submit", async (e) => {
      e.preventDefault();
      formMsg.textContent = "";
      const fd = new FormData(formLogin);
      const { ok, data } = await apiPost("/login", {
        email: fd.get("email"),
        password: fd.get("password"),
      });
      if (!ok) {
        if (data.error === "email_not_verified") {
          showMsg(formMsg, t("err_verify_first"), false);
          return;
        }
        showMsg(
          formMsg,
          data.error === "invalid_credentials" ? t("err_invalid_credentials") : (data.error || t("err_login")),
          false
        );
        return;
      }
      if (data.requires_2fa) {
        pending2faToken = data.pending_token;
        pending2faEmail = data.email;
        formLogin.hidden = true;
        form2fa.hidden = false;
        showMsg(formMsg, t("twofa_required"), true);
        return;
      }
      saveSession(data.token, data.email);
      showUser({ email: data.email, token: data.token });
    });

    form2fa.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!pending2faToken) return;
      const code = new FormData(form2fa).get("code");
      const { ok, data } = await apiPost("/login/2fa", {
        pending_token: pending2faToken,
        code: String(code || "").replace(/\s/g, ""),
      });
      if (!ok) {
        showMsg(formMsg, data.error === "invalid_2fa" ? t("err_invalid_2fa") : t("err_verify_fail"), false);
        return;
      }
      saveSession(data.token, data.email);
      form2fa.hidden = true;
      formLogin.hidden = false;
      showUser({ email: data.email, token: data.token });
    });

    formRegister.addEventListener("submit", async (e) => {
      e.preventDefault();
      formMsg.textContent = "";
      const fd = new FormData(formRegister);
      const { ok, data } = await apiPost("/register", {
        email: fd.get("email"),
        password: fd.get("password"),
      });
      if (!ok) {
        let msg = t("err_register");
        if (data.error === "email_taken") msg = t("err_email_taken");
        if (data.error === "invalid_input") msg = t("err_invalid_input");
        showMsg(formMsg, msg, false);
        return;
      }
      let msg = data.message || t("register_ok");
      if (data.verify_url) msg += " (Test: " + data.verify_url + ")";
      showMsg(formMsg, msg, true);
    });

    formResend.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = new FormData(formResend).get("email");
      const { ok, data } = await apiPost("/resend-verification", { email });
      if (!ok) {
        showMsg(formMsg, data.error === "not_found" ? t("err_not_found") : t("err_resend"), false);
        return;
      }
      let msg = data.already_verified ? t("already_verified") : t("resend_ok");
      if (data.verify_url) msg += " Test link: " + data.verify_url;
      showMsg(formMsg, msg, true);
    });

    document.getElementById("btn-logout").addEventListener("click", () => {
      clearSession();
      showGuest();
    });

    document.getElementById("btn-2fa-start").addEventListener("click", async () => {
      const session = getSession();
      if (!session) return;
      const msgEl = document.getElementById("2fa-msg");
      const { ok, data } = await apiPost("/2fa/setup", {}, session.token);
      if (!ok) {
        showMsg(msgEl, t("err_2fa_setup"), false);
        return;
      }
      document.getElementById("2fa-secret").textContent = data.secret;
      const link = document.getElementById("2fa-otpauth");
      link.href = data.otpauth;
      link.textContent = t("open_authenticator");
      document.getElementById("2fa-setup").hidden = false;
      document.getElementById("btn-2fa-start").hidden = true;
      showMsg(msgEl, t("twofa_setup_ok"), true);
    });

    document.getElementById("form-2fa-enable").addEventListener("submit", async (e) => {
      e.preventDefault();
      const session = getSession();
      if (!session) return;
      const code = new FormData(e.target).get("code");
      const msgEl = document.getElementById("2fa-msg");
      const { ok } = await apiPost("/2fa/enable", { code: String(code || "").replace(/\s/g, "") }, session.token);
      if (!ok) {
        showMsg(msgEl, t("err_invalid_2fa"), false);
        return;
      }
      showMsg(msgEl, t("twofa_enabled"), true);
      refreshAccount(session);
    });

    document.getElementById("form-2fa-disable").addEventListener("submit", async (e) => {
      e.preventDefault();
      const session = getSession();
      if (!session) return;
      const code = new FormData(e.target).get("code");
      const msgEl = document.getElementById("2fa-msg");
      const { ok } = await apiPost("/2fa/disable", { code: String(code || "").replace(/\s/g, "") }, session.token);
      if (!ok) {
        showMsg(msgEl, t("err_invalid_2fa"), false);
        return;
      }
      showMsg(msgEl, t("twofa_disabled"), true);
      refreshAccount(session);
    });

    document.getElementById("form-verify").addEventListener("submit", async (e) => {
      e.preventDefault();
      const verifyMsg = document.getElementById("verify-msg");
      const key = new FormData(e.target).get("key");
      const { data } = await apiPost("/verify", { key: key });
      if (data.valid) {
        showMsg(verifyMsg, t("license_valid") + (data.plan ? " (" + data.plan + ")" : "") + ".", true);
      } else {
        showMsg(verifyMsg, t("license_invalid"), false);
      }
    });

    document.getElementById("lang-select").addEventListener("change", () => {
      const session = getSession();
      if (session) refreshAccount(session);
    });
  </script>
</body>
</html>
